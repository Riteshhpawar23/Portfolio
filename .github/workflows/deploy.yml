# Builds the site and publishes it on every push to main.
# Needs Settings > Pages > Source set to "GitHub Actions".
name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While Pages is set to "Deploy from a branch", GitHub also publishes the raw files.
      # The last deploy wins, so this one waits. Remove this step once Source is "GitHub Actions".
      - name: Let GitHub's branch deploy finish first
        run: sleep 100
      - id: deployment
        uses: actions/deploy-pages@v5
