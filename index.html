  <script>
    // Set the theme before first paint. Follows the system until the visitor picks one.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('portfolio-theme'); } catch (e) {}
      var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').content = dark ? '#0E0E0C' : '#F6F4EF';
    })();
  </script>
</head>
